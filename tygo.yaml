# Generates wire types for the HTTP API: time.Time is an RFC3339 string and
# decimal.Decimal is a JSON number (see internal/server/json.go). Date/Decimal
# to Dayjs/number conversion belongs to the API client, not to tygo.
type_mappings:
  time.Time: "string"
  time.Month: "number"
  time.Weekday: "number"
  decimal.Decimal: "number"
  # Types that response DTOs embed from other packages. Each package is
  # generated into its own file so the wire shape stays the single source of
  # truth instead of degrading to `any /* pkg.Type */`.
  posting.Posting: "Posting"
  transaction.Transaction: "Transaction"
  accounting.BalancedPosting: "BalancedPosting"
  accounting.Point: "Point"
  assets.BalanceSummary: "BalanceSummary"
  assets.CheckingBalancePoint: "CheckingBalancePoint"
  assets.AvailableMonthRange: "AvailableMonthRange"
  assets.AssetBreakdown: "AssetBreakdown"
  config.GermanyTaxConfig: "GermanyTaxConfig"
  config.CommodityType: "CommodityType"
  taxation.Tax: "TaxationTax"
  taxation.GermanyTaxBreakdown: "GermanyTaxBreakdown"
  liabilities.Interest: "Interest"
  liabilities.Overview: "InterestOverview"
  liabilities.AssetBreakdown: "LiabilityBreakdown"
  service.PostingReturn: "PostingReturn"
  goal.GoalSummary: "GoalSummary"
  service.GoalIntelligence: "GoalIntelligence"
  service.GoalContribution: "GoalContribution"
  importer.IngestionResult: "IngestionResult"
  reconciliation.ReconciliationReport: "ReconciliationReport"
  import_rule.Rule: "ImportRule"
  template.Template: "Template"

packages:
  # Only the configuration structs are part of the config wire contract; keep
  # the server-side store out of the generated types.
  - path: "github.com/ananthakumaran/paisa/internal/config"
    output_path: "src/lib/api/config.gen.ts"
    exclude_files:
      - "store.go"
  # Model types that are embedded in API responses.
  - path: "github.com/ananthakumaran/paisa/internal/model/posting"
    output_path: "src/lib/api/posting.gen.ts"
  - path: "github.com/ananthakumaran/paisa/internal/model/transaction"
    output_path: "src/lib/api/transaction.gen.ts"
    frontmatter: |
      import type { Posting } from "./posting.gen";
  - path: "github.com/ananthakumaran/paisa/internal/accounting"
    output_path: "src/lib/api/accounting.gen.ts"
    frontmatter: |
      import type { Posting } from "./posting.gen";
  - path: "github.com/ananthakumaran/paisa/internal/server/assets"
    output_path: "src/lib/api/assets.gen.ts"
  # Liability wire types. Only the response payload structs are part of the
  # contract; the handlers themselves stay server-side.
  - path: "github.com/ananthakumaran/paisa/internal/server/liabilities"
    output_path: "src/lib/api/liabilities.gen.ts"
  - path: "github.com/ananthakumaran/paisa/internal/server/goal"
    output_path: "src/lib/api/goal.gen.ts"
    frontmatter: |
      import type { Point } from "./accounting.gen";
      import type { AssetBreakdown } from "./assets.gen";
      import type { Posting } from "./posting.gen";
      import type { GoalContribution, GoalIntelligence } from "./service.gen";
  - path: "github.com/ananthakumaran/paisa/internal/service"
    output_path: "src/lib/api/service.gen.ts"
  # Import-domain wire types. Only the files that define HTTP payloads are
  # generated; parser and reconciliation helpers stay server-side.
  - path: "github.com/ananthakumaran/paisa/internal/importer"
    output_path: "src/lib/api/importer.gen.ts"
    include_files:
      - "importer.go"
  - path: "github.com/ananthakumaran/paisa/internal/importer/reconciliation"
    output_path: "src/lib/api/reconciliation.gen.ts"
    include_files:
      - "reconciliation.go"
    # opening_balance/closing_balance are pointers without omitempty, so the
    # wire value is null (not an absent key) for statements without balances.
    optional_type: "null"
  - path: "github.com/ananthakumaran/paisa/internal/model/import_rule"
    output_path: "src/lib/api/import_rule.gen.ts"
    include_files:
      - "import_rule.go"
  - path: "github.com/ananthakumaran/paisa/internal/model/template"
    output_path: "src/lib/api/template.gen.ts"
    include_files:
      - "template.go"
  # Taxation wire types shared by the harvest, capital gain and Germany tax
  # responses. Only the response DTOs are generated; calculation helpers stay
  # server-side.
  - path: "github.com/ananthakumaran/paisa/internal/taxation"
    output_path: "src/lib/api/taxation.gen.ts"
    include_files:
      - "wire_types.go"
  # Response DTOs live in api_types.go. server.go defines the non-wire Deps
  # struct, so it is excluded.
  - path: "github.com/ananthakumaran/paisa/internal/server"
    output_path: "src/lib/api/types.gen.ts"
    exclude_files:
      - "server.go"
      - "portfolio_dimension.go"
    type_mappings:
      config.Config: "Config"
    frontmatter: |
      import type { BalancedPosting } from "./accounting.gen";
      import type {
        AssetBreakdown,
        AvailableMonthRange,
        BalanceSummary,
        CheckingBalancePoint
      } from "./assets.gen";
      import type { CommodityType, Config, GermanyTaxConfig } from "./config.gen";
      import type { GoalSummary } from "./goal.gen";
      import type { IngestionResult } from "./importer.gen";
      import type { Rule as ImportRule } from "./import_rule.gen";
      import type {
        AssetBreakdown as LiabilityBreakdown,
        Interest
      } from "./liabilities.gen";
      import type { Posting } from "./posting.gen";
      import type { ReconciliationReport } from "./reconciliation.gen";
      import type { PostingReturn } from "./service.gen";
      import type { GermanyTaxBreakdown, Tax as TaxationTax } from "./taxation.gen";
      import type { Template } from "./template.gen";
      import type { Transaction } from "./transaction.gen";
