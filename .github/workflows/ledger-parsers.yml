name: Ledger Parsers

on:
  - push
  - pull_request

jobs:
  parsers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y ledger hledger pipx
      - run: pipx install beancount==3.2.3 && pipx install beanquery==0.2.0
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ledger --version && hledger --version && bean-check --version && bean-query --version
      - run: go test ./internal/ledger -run 'TestLedgerCLIParsesTaxCategoryAndLegacyTag|TestBeancount|TestHLedgerReadsTaxCategoryAfterRecurringTag|TestParseBeancountPricesCSV' -count=1 -v
