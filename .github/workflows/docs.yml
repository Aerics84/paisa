name: Docs

permissions:
  contents: write

on:
  push:
    branches:
      - docs/*
      # - master
    tags:
      - "*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - name: publish
        run: make publish
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          BRANCH: gh-pages
          FOLDER: site
