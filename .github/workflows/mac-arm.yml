name: Mac OS ARM64 Release

on:
  push:
    branches:
      - ci/mac-*
    tags:
      - "*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  mac-binary:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
      - run: |
          VERSION=$(cat VERSION)
          LDFLAGS="-X github.com/ananthakumaran/paisa/internal/version.current=${VERSION}"
          brew install --force --overwrite sqlite3 create-dmg
          brew tap-new --no-git paisa/local
          cp ledger.rb "$(brew --repository)/Library/Taps/paisa/homebrew-local/Formula/ledger.rb"
          brew install --build-from-source --verbose paisa/local/ledger
          "$(brew --prefix ledger)/bin/ledger" --version
          cp "$(brew --prefix ledger)/bin/ledger" internal/binary/ledger
          npm ci
          npm run build
          go build -ldflags "${LDFLAGS}"
          cp paisa paisa-cli-macos-arm64
          cd desktop
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          wails build -ldflags "${LDFLAGS}"
          create-dmg --volname "Paisa" --window-pos 200 120 --window-size 800 400 --icon-size 100  --icon "Paisa.app" 200 190 --app-drop-link 600 185 --hide-extension "Paisa.app" --volicon build/bin/Paisa.app/Contents/Resources/iconfile.icns  "Paisa.dmg" build/bin/Paisa.app
          cd ..
          cp desktop/Paisa.dmg paisa-app-macos-arm64.dmg
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            paisa-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
