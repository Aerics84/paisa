name: Test

on:
  - push
  - pull_request

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PRETTIER_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install npm 12.2.1
        run: |
          npm install -g npm@12.2.1
          npm --version
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
      - name: Install Bun from npm registry
        shell: bash
        run: |
          bun_version="$(cat .bun-version)"
          mkdir -p "$HOME/.bun/bin"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-${bun_version}.tgz" \
            | tar -xz -C "$HOME/.bun/bin" --strip-components=2 package/bin/bun
          "$HOME/.bun/bin/bun" --version
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}
      - run: |
          npm ci
          npm run check:format:changed
          npm run check
          node ./scripts/gofmt-changed.mjs
          npm run test:imports
          npm run test:investment
          npm run test:monthly
          npm run build
          nix develop --command bash -lc 'go build && export PATH="${BUN_INSTALL:-$HOME/.bun}/bin:$PATH" && bun --version && unset PAISA_CONFIG && TZ=UTC bun test tests/regression.test.ts'
          nix develop --command go test ./...
      - run: node scripts/check-assets.mjs
      - run: npm run check:api
      - run: node scripts/check-preview-parity.mjs
      - run: node scripts/check-a11y-policy.mjs
      - run: node scripts/check-docs.mjs
      - run: npm run check:coverage
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          command -v govulncheck
      - name: Audit dependencies
        run: node scripts/security-gate.mjs --report .cache/security
      - uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: .cache/security
          retention-days: 90

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install npm 12.2.1
        run: |
          npm install -g npm@12.2.1
          npm --version
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
      - name: Install ledger
        run: |
          sudo apt-get update
          sudo apt-get install -y ledger
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/check-assets.mjs
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 30
