name: npm 12 gate

# Manual gate for the npm 12 upgrade. It must be registered on the default
# branch so `gh workflow run npm12-gate.yml --ref master` is reliable.
# Acceptance: npm 12.2.1 on all three platforms, package-lock.json unchanged,
# P-JS, P-REG and P-PDF green. Only then switch packageManager, workflows and
# Dockerfiles.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NPM12_VERSION: "12.2.1"

concurrency:
  group: npm12-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      # P-REG needs ledger, hledger and beancount in the versions the goldens
      # were generated with. Linux uses the repository's Nix dev shell; macOS
      # uses Homebrew (ledger 3.4.1, hledger 1.52.4) plus beancount 3.2.3 and
      # beanquery 0.2.0.
      # Windows runs with the regression test's documented tolerance for
      # missing ledger CLIs.
      - uses: nixbuild/nix-quick-install-action@v35
        if: runner.os == 'Linux'

      - uses: nix-community/cache-nix-action@v7
        if: runner.os == 'Linux'
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}

      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: "3.11"

      - name: Install ledger tooling (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ledger hledger
          python -m pip install beancount==3.2.3 beanquery==0.2.0
          ledger --version
          hledger --version
          bean-check --version
          bean-query --version

      - name: Install npm 12.2.1
        shell: bash
        run: |
          npm install -g "npm@${NPM12_VERSION}"
          npm --version
          test "$(npm --version)" = "${NPM12_VERSION}"

      - name: Install dependencies with npm 12
        shell: bash
        run: |
          git diff --exit-code -- package-lock.json
          npm ci
          npm --version
          test "$(npm --version)" = "${NPM12_VERSION}"
          git diff --exit-code -- package-lock.json

      - name: P-JS
        shell: bash
        run: |
          npm run check
          npm run build
          npm run test:imports
          npm run test:investment
          npm run test:monthly

      - name: P-PDF
        shell: bash
        run: bun test src/lib/pdf.test.ts

      - name: P-REG (Nix dev shell)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          nix develop --command bash -lc 'go build && export PATH="${BUN_INSTALL:-$HOME/.bun}/bin:$PATH" && unset PAISA_CONFIG && TZ=UTC bun test tests/regression.test.ts'

      - name: P-REG
        if: runner.os != 'Linux'
        shell: bash
        env:
          TZ: UTC
        run: |
          go build .
          bun test tests/regression.test.ts
